name: PR139 Bambu source presence patch

on:
  push:
    branches: [pre-alpha-5/bambu-compiled-nozzle-mapping]
    paths:
      - .github/workflows/pr139-source-presence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pre-alpha-5/bambu-compiled-nozzle-mapping
      - name: Revalidate source presence and topology freshness
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/foxforge/adapters/bambu/print_execution.py")
          text = path.read_text()
          text = text.replace(
              "from .mapping import bambu_slot_routes\n",
              "from .mapping import bambu_slot_id, bambu_slot_routes\n",
              1,
          )
          old = '''    native_slots = bambu_slot_routes(native)\n    topology = map_bambu_material_topology(printer_id, native)\n    topology_routes = {route.source_slot_id: route for route in topology.routes}\n    toolheads = {toolhead.toolhead_id: toolhead for toolhead in topology.toolheads}\n    blockers: list[PrintAssessmentBlocker] = []\n    resolved: list[BambuNativeMaterialRoute] = []\n\n    for binding in sorted(request.material_bindings, key=lambda item: item.material_index):\n        native_slot = native_slots.get(binding.slot_id)\n        if native_slot is None:\n'''
          new = '''    native_slots = bambu_slot_routes(native)\n    native_trays = {\n        bambu_slot_id(tray.ams_id, tray.tray_id): tray\n        for unit in native.material_units\n        for tray in unit.trays\n    }\n    topology = map_bambu_material_topology(printer_id, native)\n    if topology.stale:\n        return (), (\n            PrintAssessmentBlocker(\n                PrintAssessmentBlockerCode.MATERIAL_SOURCE_UNAVAILABLE,\n                "current Bambu material topology is stale",\n            ),\n        )\n    topology_routes = {route.source_slot_id: route for route in topology.routes}\n    toolheads = {toolhead.toolhead_id: toolhead for toolhead in topology.toolheads}\n    blockers: list[PrintAssessmentBlocker] = []\n    resolved: list[BambuNativeMaterialRoute] = []\n\n    for binding in sorted(request.material_bindings, key=lambda item: item.material_index):\n        native_slot = native_slots.get(binding.slot_id)\n        tray = native_trays.get(binding.slot_id)\n        if native_slot is None or tray is None:\n'''
          if old not in text:
              raise SystemExit("native routing anchor not found")
          text = text.replace(old, new, 1)
          old = '''            continue\n        if binding.toolhead_id is None:\n'''
          new = '''            continue\n        if tray.exists is not True:\n            blockers.append(\n                PrintAssessmentBlocker(\n                    PrintAssessmentBlockerCode.MATERIAL_SOURCE_UNAVAILABLE,\n                    f"material slot {binding.slot_id!r} is not confirmed loaded in current Bambu state",\n                )\n            )\n            continue\n        if binding.toolhead_id is None:\n'''
          if old not in text:
              raise SystemExit("compiled toolhead anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format and commit
        run: |
          python -m pip install "ruff==0.15.20"
          ruff format backend/src/foxforge/adapters/bambu/print_execution.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/foxforge/adapters/bambu/print_execution.py
          git commit -m "fix: revalidate Bambu source presence before submit"
          git push origin HEAD:pre-alpha-5/bambu-compiled-nozzle-mapping
