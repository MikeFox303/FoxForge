name: PR134 architecture fix

on:
  pull_request:
    branches: [main]
    paths:
      - backend/src/foxforge/application/artifacts/_bambu_3mf_toolheads.py
      - backend/src/foxforge/application/artifacts/_3mf_toolheads.py
      - backend/src/foxforge/application/artifacts/print_plan.py
      - .github/workflows/pr134-architecture-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Keep vendor names out of the application dependency boundary
        run: |
          git mv \
            backend/src/foxforge/application/artifacts/_bambu_3mf_toolheads.py \
            backend/src/foxforge/application/artifacts/_3mf_toolheads.py
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/foxforge/application/artifacts/print_plan.py")
          text = path.read_text()
          old = "from ._bambu_3mf_toolheads import parse_bambu_toolhead_expectations"
          new = "from ._3mf_toolheads import parse_bambu_toolhead_expectations"
          if old not in text:
              raise SystemExit("expected application parser import not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit architecture fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/foxforge/application/artifacts/_3mf_toolheads.py \
            backend/src/foxforge/application/artifacts/print_plan.py
          git commit -m "fix: keep vendor naming out of application imports"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
