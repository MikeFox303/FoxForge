name: PR132 formatter fix

on:
  pull_request:
    branches: [main]
    paths:
      - backend/src/foxforge/api/v1/artifact_reads.py
      - backend/src/foxforge/application/artifacts/__init__.py
      - backend/src/foxforge/application/artifacts/print_plan.py
      - backend/src/foxforge/runtime/app.py
      - backend/tests/api/test_artifact_reads.py
      - backend/tests/application/test_artifact_print_plan.py
      - .github/workflows/pr132-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.15.20"
      - name: Preserve structural 3MF errors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/foxforge/application/artifacts/print_plan.py")
          text = path.read_text()
          marker = "    except InvalidThreeMfError:\n        raise\n    except zipfile.BadZipFile as error:"
          if marker not in text:
              target = "    except zipfile.BadZipFile as error:"
              if target not in text:
                  raise SystemExit("expected ZIP exception block not found")
              text = text.replace(target, "    except InvalidThreeMfError:\n        raise\n" + target, 1)
              path.write_text(text)
          PY
      - name: Format changed Python files
        run: |
          ruff format \
            backend/src/foxforge/api/v1/artifact_reads.py \
            backend/src/foxforge/application/artifacts/__init__.py \
            backend/src/foxforge/application/artifacts/print_plan.py \
            backend/src/foxforge/runtime/app.py \
            backend/tests/api/test_artifact_reads.py \
            backend/tests/application/test_artifact_print_plan.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/src/foxforge/api/v1/artifact_reads.py \
            backend/src/foxforge/application/artifacts/__init__.py \
            backend/src/foxforge/application/artifacts/print_plan.py \
            backend/src/foxforge/runtime/app.py \
            backend/tests/api/test_artifact_reads.py \
            backend/tests/application/test_artifact_print_plan.py
          git commit -m "fix: preserve structural 3MF inspection errors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
