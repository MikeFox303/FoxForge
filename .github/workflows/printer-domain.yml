name: Printer domain contracts

on:
  push:
    paths:
      - 'backend/src/foxforge/**'
      - 'backend/tests/**'
      - 'backend/pyproject.toml'
      - 'backend/constraints.txt'
      - '.github/workflows/printer-domain.yml'
  pull_request:
    paths:
      - 'backend/src/foxforge/**'
      - 'backend/tests/**'
      - 'backend/pyproject.toml'
      - 'backend/constraints.txt'
      - '.github/workflows/printer-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Install checks from frozen constraints
        run: python -m pip install -c constraints.txt -e '.[dev]'
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: |
          if ! ruff format --check src tests; then
            ruff format --diff src tests
            exit 1
          fi
      - name: Contract and unit tests
        run: pytest -q
