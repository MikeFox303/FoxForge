name: Printer domain contracts

on:
  push:
    paths:
      - 'src/foxforge/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/printer-domain.yml'
  pull_request:
    paths:
      - 'src/foxforge/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/printer-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install checks
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Contract and unit tests
        run: pytest -q
