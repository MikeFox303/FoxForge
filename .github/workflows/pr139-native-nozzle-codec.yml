name: PR139 native nozzle codec patch

on:
  push:
    branches: [pre-alpha-5/bambu-compiled-nozzle-mapping]
    paths:
      - .github/workflows/pr139-native-nozzle-codec.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pre-alpha-5/bambu-compiled-nozzle-mapping
      - name: Add compiled nozzle mapping to project_file
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/src/foxforge/adapters/bambu/lan_codec.py")
          text = path.read_text()
          old = '''    use_ams = bool(ams_mapping2)\n    subtask_name = (request.requested_name or Path(remote_filename).stem).strip() or Path(remote_filename).stem\n    return {\n        "print": {\n            "sequence_id": sequence_id,\n            "command": "project_file",\n            "param": f"Metadata/plate_{plate_number}.gcode",\n            "project_id": "0",\n            "profile_id": "0",\n            "task_id": "0",\n            "subtask_id": "0",\n            "subtask_name": subtask_name,\n            "file": remote_filename,\n            "url": project_url,\n            "md5": "",\n            "timelapse": False,\n            "bed_type": "auto",\n            "bed_leveling": True,\n            "bed_levelling": True,\n            "flow_cali": True,\n            "vibration_cali": True,\n            "layer_inspect": False,\n            "use_ams": use_ams,\n            "ams_mapping": ams_mapping,\n            "ams_mapping2": ams_mapping2,\n        }\n    }\n\n\n'''
          new = '''    use_ams = bool(ams_mapping2)\n    subtask_name = (request.requested_name or Path(remote_filename).stem).strip() or Path(remote_filename).stem\n    print_payload: dict[str, object] = {\n        "sequence_id": sequence_id,\n        "command": "project_file",\n        "param": f"Metadata/plate_{plate_number}.gcode",\n        "project_id": "0",\n        "profile_id": "0",\n        "task_id": "0",\n        "subtask_id": "0",\n        "subtask_name": subtask_name,\n        "file": remote_filename,\n        "url": project_url,\n        "md5": "",\n        "timelapse": False,\n        "bed_type": "auto",\n        "bed_leveling": True,\n        "bed_levelling": True,\n        "flow_cali": True,\n        "vibration_cali": True,\n        "layer_inspect": False,\n        "use_ams": use_ams,\n        "ams_mapping": ams_mapping,\n        "ams_mapping2": ams_mapping2,\n    }\n    if routes and all(route.nozzle_index is not None for route in routes):\n        print_payload["nozzle_mapping"] = _nozzle_mapping(routes)\n    return {"print": print_payload}\n\n\n'''
          if old not in text:
              raise SystemExit("project_file payload anchor not found")
          text = text.replace(old, new, 1)

          anchor = '''def _ams_mapping(routes: tuple[BambuNativeMaterialRoute, ...]) -> list[int]:\n'''
          helper = '''def _nozzle_mapping(routes: tuple[BambuNativeMaterialRoute, ...]) -> list[int]:\n    if not routes:\n        return []\n    max_index = max(route.material_index for route in routes)\n    result = [-1] * (max_index + 1)\n    for route in routes:\n        if route.material_index < 0 or route.nozzle_index is None:\n            continue\n        result[route.material_index] = route.nozzle_index\n    return result\n\n\n'''
          if anchor not in text:
              raise SystemExit("ams mapping helper anchor not found")
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)
          PY
      - name: Format and commit codec patch
        run: |
          python -m pip install "ruff==0.15.20"
          ruff format backend/src/foxforge/adapters/bambu/lan_codec.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/foxforge/adapters/bambu/lan_codec.py
          git commit -m "feat: serialize compiled Bambu nozzle mapping"
          git push origin HEAD:pre-alpha-5/bambu-compiled-nozzle-mapping
