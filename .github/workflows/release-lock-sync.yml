name: Release lock sync

on:
  push:
    branches:
      - release/v0.1.0-alpha.4.1

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.1.0-alpha.4.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Sync npm lock metadata
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lock and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-lock-sync.yml
          git add frontend/package-lock.json
          git commit -m "release: sync npm lock metadata"
          git push origin HEAD:release/v0.1.0-alpha.4.1
