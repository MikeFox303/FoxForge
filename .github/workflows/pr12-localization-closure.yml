name: PR12 localization closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'pre-alpha-5/localization-responsive-closure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pre-alpha-5/localization-responsive-closure
          fetch-depth: 0
      - name: Apply exact localization closure edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              assert old in text, f'missing expected text in {path}: {old!r}'
              assert text.count(old) == 1, f'expected one match in {path}: {old!r}'
              target.write_text(text.replace(old, new, 1))

          replace(
              'frontend/src/features/queue/QueueCommandPanel.tsx',
              "{t('queueRouting.plate')} {candidate.plateIndex}{candidate.readyForRouting ? '' : ' · blocked'}",
              "{t('queueRouting.plate')} {candidate.plateIndex}{candidate.readyForRouting ? '' : ` · ${t('queueRouting.blockedLabel')}`}",
          )

          replace(
              'frontend/src/viewModel.ts',
              "export function describeMaterialSource(printer: PrinterViewModel): string {\n",
              "export function describeMaterialSource(\n  printer: PrinterViewModel,\n  emptyLabel = 'No material loaded',\n  genericLabel = 'Material loaded',\n): string {\n",
          )
          replace(
              'frontend/src/viewModel.ts',
              "  if (!material) return 'No material loaded';\n  return [material.materialFamily, material.vendorName].filter(Boolean).join(' · ') || 'Material loaded';",
              "  if (!material) return emptyLabel;\n  return [material.materialFamily, material.vendorName].filter(Boolean).join(' · ') || genericLabel;",
          )
          replace(
              'frontend/src/viewModel.ts',
              "  if (printer.snapshot.stale) return 'Stale';",
              "  if (printer.snapshot.stale) return 'stale';",
          )

          replace(
              'frontend/src/features/printers/PrinterDetailView.tsx',
              "import { useState } from 'react';",
              "import type { TFunction } from 'i18next';\nimport { useState } from 'react';",
          )
          replace(
              'frontend/src/features/printers/PrinterDetailView.tsx',
              "  formatPercent,\n  formatRelativeTime,\n  printerStatusLabel,",
              "  formatPercent,\n  printerStatusLabel,",
          )
          replace(
              'frontend/src/features/printers/PrinterDetailView.tsx',
              "          <span>{formatRelativeTime(printer.snapshot.observedAt)}</span>",
              "          <span>{relativeTimeLabel(printer.snapshot.observedAt, t)}</span>",
          )
          replace(
              'frontend/src/features/printers/PrinterDetailView.tsx',
              "            <DetailKpi label={t('printerDetail.material')} value={describeMaterialSource(printer)} />",
              "            <DetailKpi\n              label={t('printerDetail.material')}\n              value={describeMaterialSource(\n                printer,\n                t('printerDetail.noMaterialLoaded'),\n                t('printerDetail.materialLoaded'),\n              )}\n            />",
          )
          replace(
              'frontend/src/features/printers/PrinterDetailView.tsx',
              "function materialUnitKey(kind: string): 'multiSlot' | 'external' | 'toolhead' | 'materialUnit' {",
              "function relativeTimeLabel(observedAt: string, t: TFunction, nowMs: number = Date.now()): string {\n  const observedMs = Date.parse(observedAt);\n  if (Number.isNaN(observedMs)) return t('alpha.relative.recently');\n  const deltaMs = Math.max(0, nowMs - observedMs);\n  if (deltaMs < 60_000) return t('alpha.relative.justNow');\n  if (deltaMs < 3_600_000) return t('alpha.relative.minutes', { count: Math.floor(deltaMs / 60_000) });\n  if (deltaMs < 86_400_000) return t('alpha.relative.hours', { count: Math.floor(deltaMs / 3_600_000) });\n  return t('alpha.relative.days', { count: Math.floor(deltaMs / 86_400_000) });\n}\n\nfunction materialUnitKey(kind: string): 'multiSlot' | 'external' | 'toolhead' | 'materialUnit' {",
          )

          for old, new in [
              ("        noMaterialData: 'Material information is not available for this printer.',", "        noMaterialData: 'Material information is not available for this printer.',\n        noMaterialLoaded: 'No material loaded',\n        materialLoaded: 'Material loaded',"),
              ("        noMaterialData: 'Информация о материалах для этого принтера недоступна.',", "        noMaterialData: 'Информация о материалах для этого принтера недоступна.',\n        noMaterialLoaded: 'Материал не загружен',\n        materialLoaded: 'Материал загружен',"),
              ("        noMaterialData: 'Інформація про матеріали для цього принтера недоступна.',", "        noMaterialData: 'Інформація про матеріали для цього принтера недоступна.',\n        noMaterialLoaded: 'Матеріал не завантажено',\n        materialLoaded: 'Матеріал завантажено',"),
          ]:
              replace('frontend/src/i18n.ts', old, new)

          replace(
              'frontend/e2e/responsive-layout.spec.ts',
              "      test.skip(!['phone', 'desktop-16-9'].includes(testInfo.project.name));\n\n      await page.addInitScript((selectedLanguage) => {",
              "      await page.addInitScript((selectedLanguage) => {",
          )
          replace(
              'frontend/e2e/responsive-layout.spec.ts',
              "    test.skip(!['phone', 'desktop-16-9'].includes(testInfo.project.name));\n\n    await page.addInitScript((selectedLanguage) => {",
              "    await page.addInitScript((selectedLanguage) => {",
          )
          PY
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/features/queue/QueueCommandPanel.tsx frontend/src/viewModel.ts frontend/src/features/printers/PrinterDetailView.tsx frontend/src/i18n.ts frontend/e2e/responsive-layout.spec.ts
          git commit -m 'fix(ui): close localization and responsive gaps'
          git push origin HEAD:pre-alpha-5/localization-responsive-closure
