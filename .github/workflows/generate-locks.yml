name: Generate dependency locks

on:
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'backend/pyproject.toml'
      - '.github/workflows/generate-locks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  locks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate npm lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate Python constraints
        working-directory: backend
        run: |
          python -m pip install 'uv==0.8.17'
          uv pip compile pyproject.toml --extra dev --output-file constraints.txt

      - name: Commit exact generated locks
        shell: bash
        run: |
          git add frontend/package-lock.json backend/constraints.txt
          if git diff --cached --quiet; then
            echo 'Dependency locks are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: freeze dependency graphs'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
