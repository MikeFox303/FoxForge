name: Generate dependency locks

on:
  pull_request:
    paths:
      - 'frontend/package.json'
      - 'backend/pyproject.toml'
      - '.github/workflows/generate-locks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate npm lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate Python constraints
        working-directory: backend
        run: |
          python -m pip install 'uv==0.8.17'
          uv pip compile pyproject.toml --extra dev --output-file constraints.txt

      - uses: actions/upload-artifact@v4
        with:
          name: foxforge-dependency-locks
          if-no-files-found: error
          path: |
            frontend/package-lock.json
            backend/constraints.txt
