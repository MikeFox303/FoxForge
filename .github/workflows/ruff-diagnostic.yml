name: Ruff diagnostic

on:
  pull_request:
    paths:
      - 'backend/src/foxforge/**'
      - 'backend/tests/**'
      - 'backend/pyproject.toml'
      - '.github/workflows/ruff-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install checks
        run: python -m pip install -e '.[dev]'
      - name: Capture Ruff output
        id: ruff
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check src tests 2>&1 | tee ruff-diagnostic.txt
      - name: Upload Ruff output
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostic
          path: backend/ruff-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
