name: Refresh Alpha 4.3 lock metadata

on:
  push:
    branches:
      - release/v0.1.0-alpha.4.3

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.1.0-alpha.4.3
      - name: Synchronize package-lock version metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'frontend/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '0.1.0-alpha.4.3';
          lock.packages[''].version = '0.1.0-alpha.4.3';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Commit lock metadata when needed
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git commit -m 'release: synchronize alpha.4.3 npm lock metadata'
          git push origin HEAD:release/v0.1.0-alpha.4.3
