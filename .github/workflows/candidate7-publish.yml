name: Candidate 7 publication

on:
  pull_request:
    paths:
      - '.github/workflows/candidate7-publish.yml'
      - 'docs/testing/pre-alpha-5-bambu-physical-validation.md'
  push:
    branches:
      - 'pre-alpha-5/candidate7-publish'
    paths:
      - '.candidate7/source.json'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read
  actions: read

concurrency:
  group: foxforge-candidate7-publication
  cancel-in-progress: false

jobs:
  contract:
    name: Candidate 7 publication contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify hard publication boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/candidate7-publish.yml').read_text(encoding='utf-8')
          if 'pre-alpha-5/candidate7-publish' not in text:
              raise SystemExit('dedicated Candidate 7 publish branch trigger is missing')
          if '.candidate7/source.json' not in text:
              raise SystemExit('Candidate 7 source marker trigger is missing')
          if 'packages: write' not in text:
              raise SystemExit('GHCR publication permission is missing')

          forbidden_commands = [
              'gh release ' + 'create',
              'git ' + 'tag ',
          ]
          for command in forbidden_commands:
              if command in text:
                  raise SystemExit(f'forbidden semantic publication command: {command}')

          manifest_path = 'release/' + 'manifest.json'
          if text.count(manifest_path) != 1:
              raise SystemExit('semantic release manifest may only be read once by Candidate 7 publisher')
          PY

  publish:
    name: Publish or recover exact Candidate 7 image
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/pre-alpha-5/candidate7-publish'
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.freeze.outputs.source_sha }}
      short_sha: ${{ steps.freeze.outputs.short_sha }}
      image_digest: ${{ steps.resolve.outputs.digest }}
      package_version: ${{ steps.freeze.outputs.package_version }}
    steps:
      - name: Checkout publication marker
        uses: actions/checkout@v7

      - name: Parse frozen source marker
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          marker = json.loads(Path('.candidate7/source.json').read_text(encoding='utf-8'))
          sha = marker.get('sourceCommit', '')
          if marker.get('candidate') != 7:
              raise SystemExit('candidate must be 7')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('sourceCommit must be a full lowercase Git SHA')
          if marker.get('baseReleaseVersion') != '0.1.0-alpha.4.3':
              raise SystemExit('baseReleaseVersion must remain 0.1.0-alpha.4.3')
          if marker.get('targetReleaseVersion') != '0.1.0-alpha.5':
              raise SystemExit('targetReleaseVersion must remain 0.1.0-alpha.5')
          package_version = marker.get('packageVersion')
          if package_version != '0.1.0-alpha.4.3-umbrel.7':
              raise SystemExit('packageVersion must be Candidate 7 package identity')
          expected_digest = marker.get('publishedImageDigest', '')
          if expected_digest and not re.fullmatch(r'sha256:[0-9a-f]{64}', expected_digest):
              raise SystemExit('publishedImageDigest must be an OCI sha256 digest when present')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'source_sha={sha}\n')
              out.write(f'short_sha={sha[:7]}\n')
              out.write(f'package_version={package_version}\n')
              out.write(f'expected_digest={expected_digest}\n')
          PY

      - name: Require clean exact-main software gate PASS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.freeze.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$SOURCE_SHA"
          open_prs="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq 'length')"
          test "$open_prs" = "0"
          green="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&status=completed&per_page=100" --jq '[.workflow_runs[] | select(.name == "Candidate 6 software gate" and .event == "push" and .conclusion == "success")] | length')"
          test "$green" -ge 1

      - name: Checkout exact frozen FoxForge source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.freeze.outputs.source_sha }}
          fetch-depth: 0

      - name: Verify semantic release remains unpromoted
        env:
          SOURCE_SHA: ${{ steps.freeze.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('release/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.1.0-alpha.4.3'
          assert manifest['tag'] == 'v0.1.0-alpha.4.3'
          PY
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0-alpha.5 >/dev/null 2>&1; then
            echo 'v0.1.0-alpha.5 already exists; Candidate 7 publisher refuses to continue.' >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable Candidate source tag
        id: existing
        env:
          IMAGE: ghcr.io/mikefox303/foxforge:sha-${{ steps.freeze.outputs.short_sha }}
          EXPECTED_DIGEST: ${{ steps.freeze.outputs.expected_digest }}
        shell: bash
        run: |
          set -euo pipefail
          if inspect="$(docker buildx imagetools inspect "$IMAGE" 2>/dev/null)"; then
            digest="$(printf '%s\n' "$inspect" | awk '/^Digest:/ {print $2; exit}')"
            test -n "$digest"
            if [ -z "$EXPECTED_DIGEST" ]; then
              echo "Candidate source tag already exists without an explicitly frozen recovery digest: $IMAGE" >&2
              exit 1
            fi
            test "$digest" = "$EXPECTED_DIGEST"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$EXPECTED_DIGEST" ]; then
              echo "Frozen recovery digest is recorded but Candidate tag is missing: $IMAGE@$EXPECTED_DIGEST" >&2
              exit 1
            fi
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish versioned multi-architecture Candidate 7 image
        id: image
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/mikefox303/foxforge:sha-${{ steps.freeze.outputs.short_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.freeze.outputs.package_version }}
            org.opencontainers.image.revision=${{ steps.freeze.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/MikeFox303/FoxForge
          build-args: |
            VCS_REF=${{ steps.freeze.outputs.source_sha }}
            VERSION=${{ steps.freeze.outputs.package_version }}
          provenance: mode=max
          sbom: true

      - name: Resolve immutable Candidate digest
        id: resolve
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          digest="$EXISTING_DIGEST"
          if [ -z "$digest" ]; then
            digest="$BUILT_DIGEST"
          fi
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify published immutable index and platforms
        env:
          IMAGE: ghcr.io/mikefox303/foxforge:sha-${{ steps.freeze.outputs.short_sha }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}")"
          printf '%s\n' "$inspect"
          printf '%s\n' "$inspect" | grep -q 'linux/amd64'
          printf '%s\n' "$inspect" | grep -q 'linux/arm64'

  anonymous-pull:
    name: Anonymous pull ${{ matrix.platform }}
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/pre-alpha-5/candidate7-publish'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Verify public anonymous platform pull
        env:
          IMAGE: ghcr.io/mikefox303/foxforge:sha-${{ needs.publish.outputs.short_sha }}
          DIGEST: ${{ needs.publish.outputs.image_digest }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull --platform "$PLATFORM" "${IMAGE}@${DIGEST}"

  record:
    name: Record Candidate 7 publication identity
    needs:
      - publish
      - anonymous-pull
    if: github.event_name == 'push' && github.ref == 'refs/heads/pre-alpha-5/candidate7-publish'
    runs-on: ubuntu-latest
    steps:
      - name: Record immutable Candidate 7 publication identity
        env:
          SOURCE_SHA: ${{ needs.publish.outputs.source_sha }}
          SHORT_SHA: ${{ needs.publish.outputs.short_sha }}
          DIGEST: ${{ needs.publish.outputs.image_digest }}
          PACKAGE_VERSION: ${{ needs.publish.outputs.package_version }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          identity = {
              'candidate': 7,
              'sourceCommit': os.environ['SOURCE_SHA'],
              'image': f"ghcr.io/mikefox303/foxforge:sha-{os.environ['SHORT_SHA']}",
              'imageDigest': os.environ['DIGEST'],
              'platforms': ['linux/amd64', 'linux/arm64'],
              'packageVersion': os.environ['PACKAGE_VERSION'],
              'baseReleaseVersion': '0.1.0-alpha.4.3',
              'targetReleaseVersion': '0.1.0-alpha.5',
              'workflowRun': int(os.environ['GITHUB_RUN_ID']),
          }
          Path('candidate7-publication.json').write_text(json.dumps(identity, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(identity, indent=2))
          PY

      - name: Upload Candidate 7 publication identity
        uses: actions/upload-artifact@v4
        with:
          name: candidate7-publication-${{ needs.publish.outputs.source_sha }}
          path: candidate7-publication.json
          if-no-files-found: error
          retention-days: 90
