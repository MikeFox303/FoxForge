name: Temporary release lock sync

on:
  push:
    branches:
      - release/v0.1.0-alpha.4.2

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v0.1.0-alpha.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Synchronize npm release metadata
        working-directory: frontend
        run: npm version 0.1.0-alpha.4.2 --no-git-tag-version --allow-same-version
      - name: Commit lock metadata
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "Release metadata is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "release: sync npm lock metadata"
          git push origin HEAD:release/v0.1.0-alpha.4.2
