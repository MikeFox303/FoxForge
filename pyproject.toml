[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foxforge"
version = "0.1.0.dev0"
description = "Vendor-independent 3D printer management core for FoxForge"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "MikeFox303" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff==0.15.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
