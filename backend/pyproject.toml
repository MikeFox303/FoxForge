[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foxforge"
version = "0.1.0a3"
description = "Vendor-independent 3D printer management core for FoxForge"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
authors = [{ name = "MikeFox303" }]
dependencies = [
  "aiohttp>=3.12,<4",
  "paho-mqtt>=2.1,<3",
]

[project.scripts]
foxforge = "foxforge.runtime.__main__:main"

[project.optional-dependencies]
dev = [
  "coverage==7.15.2",
  "pytest>=9.0.3,<10",
  "ruff==0.15.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
