services:
  foxforge:
    image: ghcr.io/mikefox303/foxforge:main
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "8420:8000"
    environment:
      TZ: Europe/Kyiv
      FOXFORGE_PORT: "8000"
      FOXFORGE_DATA_DIR: /data
      FOXFORGE_CONFIG: /data/config.json
      FOXFORGE_RECONNECT_SECONDS: "15"
      # Required for browser/API writes. Leave unset for an intentionally read-only runtime.
      FOXFORGE_COMMAND_TOKEN: ${FOXFORGE_COMMAND_TOKEN:-}
      # Candidate 6 safety default. Use bambu-validation only for the controlled
      # Bambu accounting validation workflow documented in the physical runbook.
      FOXFORGE_FILAMENT_ACCOUNTING_MODE: ${FOXFORGE_FILAMENT_ACCOUNTING_MODE:-disabled}
    volumes:
      - foxforge_data:/data

volumes:
  foxforge_data:
